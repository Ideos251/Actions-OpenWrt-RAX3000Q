name: Build RAX3000Q OpenClash

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout config
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget

    - name: Clone OpenWrt source
      run: |
        git clone https://github.com/kkstone/immortalwrt-ipq50xx.git -b openwrt-21.02 openwrt

    - name: Add OpenClash feed
      working-directory: ./openwrt
      run: |
        echo 'src-git openclash https://github.com/vernesong/OpenClash.git;master' >> feeds.conf.default

    - name: Update and install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Download Mihomo Core
      working-directory: ./openwrt
      run: |
        mkdir -p files/etc/openclash/core
        wget -q https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-armv7-v1.19.33.gz -O mihomo.gz
        gzip -d mihomo.gz
        mv mihomo files/etc/openclash/core/clash_meta
        cp files/etc/openclash/core/clash_meta files/etc/openclash/core/clash_tun
        chmod +x files/etc/openclash/core/clash_meta
        chmod +x files/etc/openclash/core/clash_tun

    - name: Generate config
      working-directory: ./openwrt
      run: |
        rm -f .config
        echo "CONFIG_TARGET_ipq50xx=y" >> .config
        echo "CONFIG_TARGET_ipq50xx_arm=y" >> .config
        echo "CONFIG_TARGET_ipq50xx_arm_DEVICE_cmcc_rax3000q=y" >> .config
        
        echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_kmod-inet-diag=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-tproxy=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-core=y" >> .config
        echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
        echo "CONFIG_PACKAGE_ip-full=y" >> .config
        
        echo "# CONFIG_PACKAGE_coccinelle is not set" >> .config
        
        make defconfig

    # 【针对报错的终极修复】提前强制拉取 backports 源码包
    - name: Pre-download broken source
      working-directory: ./openwrt
      run: |
        mkdir -p dl
        # 直接从 OpenWrt 的官方下载站拉取，绕过某些抽风的镜像
        wget -q https://sources.openwrt.org/backports-20210222-5.4-qsdk-11.5.0.5.tar.xz -O dl/backports-20210222-5.4-qsdk-11.5.0.5.tar.xz
        # 验证文件是否真的下载成功（大小必须大于 0）
        ls -la dl/backports-20210222-5.4-qsdk-11.5.0.5.tar.xz

    # 只下载，不编译，确保所有包都齐了
    - name: Download package source
      working-directory: ./openwrt
      run: |
        make -j1 download

    - name: Build firmware
      working-directory: ./openwrt
      run: |
        make -j4 || make -j1 V=s

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-rax3000q-openclash-arm
        path: openwrt/bin/targets/
